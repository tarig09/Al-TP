name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Secret SUPABASE_ANON_KEY is missing"; exit 1; }
          mkdir dist
          cp -r index.html manifest.webmanifest css js assets dist/
          printf 'window.ENV={SUPABASE_URL:"%s",SUPABASE_ANON_KEY:"%s"};\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > dist/js/config.js
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
