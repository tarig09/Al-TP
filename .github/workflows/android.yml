name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # اختياري: للتوقيع النهائي (release) — انظر README
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # اختياري: للإشعارات الفورية — محتوى google-services.json من Firebase
      GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare app files (keys + bundled library and font)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUSH_ENABLED: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '' }}
        run: python3 tools/prepare_www.py

      - name: Add Android platform
        run: |
          npx cap add android
          python3 tools/apply_android_branding.py
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
            echo "push: google-services.json installed"
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AL-MAHATTA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK + AAB (only if signing secrets exist)
        if: env.KS_B64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out "$RUNNER_TEMP/AL-MAHATTA-release.apk" "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/AL-MAHATTA-release.aab"

      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: AL-MAHATTA-release
          path: |
            ${{ runner.temp }}/AL-MAHATTA-release.apk
            ${{ runner.temp }}/AL-MAHATTA-release.aab
          if-no-files-found: error
